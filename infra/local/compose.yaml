name: haru-story

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: haru_story
      POSTGRES_USER: haru
      POSTGRES_PASSWORD: haru
    ports:
      - "127.0.0.1:${HARU_DB_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haru -d haru_story"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
