name: Checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run format:check:web
      - run: npm run typecheck --workspaces
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      HARU_TEST_DATABASE: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: haru_story
          POSTGRES_USER: haru
          POSTGRES_PASSWORD: haru
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U haru -d haru_story"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --project services/backend --locked
      - run: uv run --project services/backend --locked ruff check --config services/backend/pyproject.toml services/backend/src services/backend/tests tooling/export_graphql_schema.py
      - run: uv run --project services/backend --locked ruff format --check --config services/backend/pyproject.toml services/backend/src services/backend/tests tooling/export_graphql_schema.py
      - run: uv run --project services/backend --locked python -m pytest
      - run: uv run --project services/backend --locked python tooling/export_graphql_schema.py --check

  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cargo fmt --check
        working-directory: apps/client/src-tauri
      - run: npm run build:client:desktop
